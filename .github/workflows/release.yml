name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: macos-26
            target: bun-darwin-arm64
            asset: ocs-darwin-arm64
          - os: macos-26-intel
            target: bun-darwin-x64
            asset: ocs-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: ocs-linux-x64
    runs-on: ${{ matrix.os }}
    # secrets 不能出现在步骤级 if 里（整个 workflow 会被拒、没有日志），提到 job 级 env。
    # secret 名与 leeguooooo/chrome-use、iphone-use 一致。
    env:
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_CERTIFICATE != '' && secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: release notes exist in CHANGELOG.md
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > /dev/null
      - run: bun install
      - run: bun test
      - name: build binary
        run: bun build --compile --target=${{ matrix.target }} src/cli.ts --outfile ocs
      # Developer ID 签名 + 公证：ad-hoc 签名每次构建 cdhash 都变，macOS 防火墙 / Gatekeeper
      # 把每个新版本当陌生程序（浏览器下载的会被拒、防火墙要重新放行）。hardened runtime 下
      # bun 的 JavaScriptCore 需要 JIT 两项 entitlements（scripts/entitlements.plist）。
      # 裸可执行文件没法 staple，公证结果由 Gatekeeper 在线查。
      - name: sign and notarize macOS binary (Developer ID)
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(openssl rand -hex 20)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychain -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --options runtime --timestamp --entitlements scripts/entitlements.plist \
            -s "$APPLE_SIGN_IDENTITY" --keychain "$kc" ocs
          codesign --verify --strict --verbose=2 ocs
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          ditto -c -k --keepParent ocs "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/notarize.zip"
          spctl -a -vvv -t install ocs
          security delete-keychain "$kc" || true
      # 没有签名 secrets（fork 构建 tag）时退回 ad-hoc：未签名的构建照样能用，不算失败。
      - name: ad-hoc sign macOS binary
        if: runner.os == 'macOS' && env.HAS_SIGNING != 'true'
        run: |
          codesign --force --sign - ocs
          codesign --verify --deep --strict --verbose=4 ocs
      - name: smoke test release binary
        run: ./ocs help
      - name: package binary
        run: |
          tar -czf ${{ matrix.asset }}.tar.gz ocs
          shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md 2>/dev/null \
            || gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          gh release upload "${GITHUB_REF_NAME}" ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}.tar.gz.sha256 --clobber
  windows:
    # Windows 只出二进制：仓库测试依赖 Unix socket / ps，照常在上面三个平台跑。
    # 冒烟测试必须在真 Windows 上跑编译产物（交叉编译出来不跑一次不算数）。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: build binary
        run: bun build --compile --target=bun-windows-x64 src/cli.ts --outfile ocs.exe
      - name: smoke test release binary
        run: ./ocs.exe help && ./ocs.exe version
      - name: Windows receiver end-to-end tests with compiled binaries
        run: |
          bun build --compile test/fixtures/agy-cli.ts --outfile fake-agy.exe
          OCS_TEST_BINARY="$PWD/ocs.exe" OCS_TEST_AGY_BINARY="$PWD/fake-agy.exe" bun test test/agy-windows.test.ts
      - name: package binary
        run: |
          7z a -tzip ocs-windows-x64.zip ocs.exe
          sha256sum ocs-windows-x64.zip > ocs-windows-x64.zip.sha256
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md 2>/dev/null \
            || gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          gh release upload "${GITHUB_REF_NAME}" ocs-windows-x64.zip ocs-windows-x64.zip.sha256 --clobber
