name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: macos-26
            target: bun-darwin-arm64
            asset: ocs-darwin-arm64
          - os: macos-26-intel
            target: bun-darwin-x64
            asset: ocs-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: ocs-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - name: build binary
        run: bun build --compile --target=${{ matrix.target }} src/cli.ts --outfile ocs
      - name: ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - ocs
          codesign --verify --deep --strict --verbose=4 ocs
      - name: smoke test release binary
        run: ./ocs help
      - name: package binary
        run: |
          tar -czf ${{ matrix.asset }}.tar.gz ocs
          shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}.tar.gz.sha256 --clobber
