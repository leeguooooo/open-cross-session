name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - name: build, sign, and smoke test binary
        run: |
          bun build --compile src/cli.ts --outfile /tmp/ocs
          codesign --force --sign - /tmp/ocs
          codesign --verify --deep --strict --verbose=4 /tmp/ocs
          /tmp/ocs help
  windows-agy:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun build --compile src/cli.ts --outfile ocs.exe
      - run: bun build --compile test/fixtures/agy-cli.ts --outfile fake-agy.exe
      - name: Windows receiver end-to-end tests with compiled binaries
        run: OCS_TEST_BINARY="$PWD/ocs.exe" OCS_TEST_AGY_BINARY="$PWD/fake-agy.exe" bun test test/agy-windows.test.ts
      - name: Grok Windows pipe identity checks
        run: bun test test/grok.test.ts

  prepare-release:
    needs: [check, windows-agy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prepare-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: prepare version and tag from tested main
        id: prepare
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo "Newer main commit exists; its CI will prepare the release"
            exit 0
          fi
          bun scripts/prepare-release.ts
          if git diff --quiet; then exit 0; fi
          tag="v$(bun -p 'require("./package.json").version')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/cli.ts CHANGELOG.md
          git commit -m "chore(release): 发布 $tag"
          git tag "$tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  release:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare-release.outputs.tag }}
    secrets: inherit
