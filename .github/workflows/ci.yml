name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - name: build, sign, and smoke test binary
        run: |
          bun build --compile src/cli.ts --outfile /tmp/ocs
          codesign --force --sign - /tmp/ocs
          codesign --verify --deep --strict --verbose=4 /tmp/ocs
          /tmp/ocs help
